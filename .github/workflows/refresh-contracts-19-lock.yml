# final Contracts 19 validation pass
name: Refresh Doctor Contracts 19 lockfile

on:
  push:
    branches:
      - fix/contracts-19-environments
    paths:
      - '.github/workflows/refresh-contracts-19-lock.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contracts-19-environments
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Remove superseded Authz engine contract
        run: |
          perl -0pi -e "s/import \{ AUTHZ_ENGINES, AUTHZ_KINDS \} from '\@ankhorage\/contracts';\n//" src/manifestAnalysis.ts
          perl -0pi -e "s/const MANIFEST_PROFILE =/const AUTHZ_KINDS = ['RBAC', 'ABAC'] as const;\nconst MANIFEST_PROFILE =/" src/manifestAnalysis.ts
          perl -0pi -e "s/\n  validateAuthorizationField\(\{\n    allowed: AUTHZ_ENGINES,\n    diagnostics,\n    fieldName: 'engine',\n    manifestPath,\n    value: value\.engine,\n    ruleId: 'manifest\.auth\.authorization\.engine\.valid',\n  \}\);//s" src/manifestAnalysis.ts
      - name: Update Contracts dependency and lockfile
        run: |
          bun --eval '
          const path = "package.json";
          const pkg = await Bun.file(path).json();
          pkg.dependencies["@ankhorage/contracts"] = "^19.1.0";
          await Bun.write(path, `${JSON.stringify(pkg, null, 2)}\n`);
          '
          bun update --lockfile-only @ankhorage/contracts
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
      - name: Commit refreshed dependency state
        run: |
          rm .github/workflows/refresh-contracts-19-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/manifestAnalysis.ts package.json bun.lock .github/workflows/refresh-contracts-19-lock.yml
          git commit -m 'fix: consume current Contracts environments'
          git push origin HEAD:fix/contracts-19-environments
