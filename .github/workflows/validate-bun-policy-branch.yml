name: Validate Bun Policy Branch

on:
  push:
    branches:
      - agent/validate-bun-runtime-policy

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install and refresh lockfile
        run: bun install

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "refresh Bun lockfile"
            git push origin HEAD:agent/validate-bun-runtime-policy
          fi

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Knip
        run: bun run knip

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck
