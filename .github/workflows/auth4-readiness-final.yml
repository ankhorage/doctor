name: Auth4 Doctor readiness final

on:
  push:
    branches:
      - agent/auth4-target-readiness

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth4-target-readiness
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and validate
        run: |
          bun run format
          bun run lint:fix
          bun run build
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck

      - name: Commit validated boundaries
        run: |
          rm .github/workflows/auth4-readiness-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Finalize Auth readiness boundaries'
          git push origin HEAD:agent/auth4-target-readiness
